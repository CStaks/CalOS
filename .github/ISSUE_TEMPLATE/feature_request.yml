name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels:

* enhancement
  body:

* type: markdown
  attributes:
  value: |
  Thanks for suggesting an improvement!
  Please explain what you'd like to see and why it would be useful.

* type: textarea
  id: problem
  attributes:
  label: What problem would this solve?
  description: Explain the problem or limitation that this feature would address.
  placeholder: Describe the problem you're trying to solve.
  validations:
  required: true

* type: textarea
  id: solution
  attributes:
  label: Proposed solution
  description: Describe the feature or behavior you'd like to see.
  placeholder: Explain how you think it should work.
  validations:
  required: true

* type: textarea
  id: alternatives
  attributes:
  label: Alternatives considered
  description: Describe any alternative solutions or workarounds you've considered.

* type: textarea
  id: additional
  attributes:
  label: Additional context
  description: Add examples, screenshots, links, or any other relevant information.

---
name: Build disk images

on:
  workflow_run:
    workflows: ["Build container image"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '15 11 * * *'  # 11:15am UTC, after the daily container build
  pull_request:
    branches:
      - main
    paths:
      - './disk_config/disk.toml'
      - './disk_config/iso-gnome.toml'
      - './.github/workflows/build-disk.yml'
  workflow_dispatch:
    inputs:
      create-release:
        description: "Create a GitHub Release with download links"
        required: false
        default: true
        type: boolean
      platform:
        description: "Build platform"
        required: false
        default: amd64
        type: choice
        options:
          - amd64
          - arm64

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  BASE_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images (${{ matrix.variant.name }})
    runs-on: ${{ (inputs.platform || 'amd64') == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: standard
            suffix: ""
          - name: nvidia
            suffix: "-nvidia"
        disk-type: ["qcow2", "anaconda-iso"]
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Build the full tag with variant suffix (e.g. "latest" or "latest-nvidia")
          DEFAULT_TAG="${{ env.BASE_TAG }}${{ matrix.variant.suffix }}"
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: (inputs.platform || 'amd64') == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: (inputs.platform || 'amd64') != 'arm64'
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso-gnome.toml' || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          additional-args: --use-librepo=True --rootfs btrfs

      - name: Remove manifest JSON files from output
        run: |
          rm -f "${{ steps.build.outputs.output-directory }}"/*.json

      - name: Upload disk images and Checksum to Job Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: disk-images-${{ matrix.variant.name }}-${{ matrix.disk-type }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.create-release == true)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download disk images
        uses: actions/download-artifact@v8
        with:
          path: release
          pattern: disk-images-*

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for artifact in release/disk-images-*; do
            [ -d "$artifact" ] || continue
            variant=$(basename "$artifact" | sed 's/^disk-images-\([^-]*\)-.*/\1/')
            for file in "$artifact"/*; do
              [ -f "$file" ] || continue
              # Skip JSON manifest files — only publish actual disk images
              [[ "$file" == *.json ]] && continue
              cp "$file" "dist/${variant}-$(basename "$file")"
            done
          done
          gh release delete continuous --yes 2>/dev/null || true
          NOTES=$(printf 'Latest CalOS disk images.\n\n- **standard** — AMD / Intel GPUs\n- **nvidia** — NVIDIA GPUs\n\nqcow2 files are for VMs, anaconda-iso files are for USB/installer media. This release is replaced on every build, so these download links stay the same.')
          gh release create continuous dist/* \
            --title "Latest disk images" \
            --notes "$NOTES"


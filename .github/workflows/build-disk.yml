---
name: Build disk images

on:
  workflow_run:
    workflows: ["Build container image"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '15 11 * * *'  # 11:15am UTC, after the daily container build
  push:
    tags:
      - 'v*'  # versioned release: v1.2.0 -> SourceForge /1.2.0/ + GitHub Release
  pull_request:
    branches:
      - main
    paths:
      - './disk_config/disk.toml'
      - './disk_config/iso-gnome.toml'
      - './.github/workflows/build-disk.yml'
  workflow_dispatch:
    inputs:
      create-release:
        description: "Publish disk images to SourceForge"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  BASE_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # On tag runs (v*), build the CalOS container images with the release
  # codename stamped into os-release and push them as versioned tags
  # (ghcr.io/<owner>/calos:v1.2.0 / :v1.2.0-nvidia) — this is what bootc
  # switch users pull for a release. The disk matrix below then builds from
  # those same versioned images, so ISO/VM artifacts carry the codename too.
  build-versioned-images:
    name: Build versioned container images (${{ matrix.name }} ${{ matrix.platform }})
    if: github.ref_type == 'tag'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: standard
            platform: amd64
            runner: ubuntu-24.04
            suffix: ""
            base_image: "ghcr.io/ublue-os/bluefin:stable"
          # ARM64 tracks the Bluefin LTS arm64 tag (Bluefin `stable` is x86_64
          # only). No arm64 NVIDIA base exists from ublue-os.
          - name: standard
            platform: arm64
            runner: ubuntu-24.04-arm
            suffix: "-arm64"
            base_image: "ghcr.io/ublue-os/bluefin:lts-testing-arm64"
          - name: nvidia
            platform: amd64
            runner: ubuntu-24.04
            suffix: "-nvidia"
            base_image: "ghcr.io/ublue-os/bluefin-nvidia-open:stable"
    env:
      IMAGE_NAME: ${{ github.event.repository.name }}
      IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Compute version and codename
        shell: bash
        run: |
          set -euo pipefail
          source build_files/codenames.sh
          REF_NAME="${{ github.ref_name }}"
          VERSION="${REF_NAME#v}"
          MINOR="${VERSION%.*}"
          MINOR_NUM="${MINOR##*.}"
          CODENAME="$(calos_codename "${MINOR_NUM}")"
          if [[ -z "$CODENAME" ]]; then
            echo "::error::No codename mapped for minor ${MINOR_NUM} (tag ${REF_NAME}) — add it to build_files/codenames.sh" >&2
            exit 1
          fi
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"
          echo "CALOS_VERSION=${MINOR}" >> "$GITHUB_ENV"
          echo "CALOS_CODENAME=${CODENAME}" >> "$GITHUB_ENV"
          echo "VERSION_TAG=${REF_NAME}${{ matrix.suffix }}" >> "$GITHUB_ENV"

      - name: Build versioned image
        run: |
          sudo -E $(command -v just) build \
            "${IMAGE_NAME}" \
            "${VERSION_TAG}" \
            "BASE_IMAGE=${{ matrix.base_image }} CALOS_VERSION=${CALOS_VERSION} CALOS_CODENAME=${CALOS_CODENAME}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push versioned image to GHCR
        run: |
          set -euo pipefail
          sudo -E podman push "${IMAGE_NAME}:${VERSION_TAG}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION_TAG}"

  build:
    name: Build disk images (${{ matrix.variant.name }} ${{ matrix.architecture }})
    needs: build-versioned-images
    if: ${{ needs.build-versioned-images.result == 'success' || needs.build-versioned-images.result == 'skipped' }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: standard
            suffix: ""
          - name: nvidia
            suffix: "-nvidia"
        # x86_64 (the default, what most people have) and ARM64. NVIDIA disk
        # images are x86_64 only — there is no arm64 NVIDIA container image.
        architecture: ["amd64", "arm64"]
        disk-type: ["qcow2", "anaconda-iso", "vmdk"]
        exclude:
          - variant:
              name: nvidia
            disk-type: vmdk
          - variant:
              name: nvidia
            architecture: arm64
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Build the full tag with variant + architecture suffix — "latest" /
          # "latest-nvidia" / "latest-arm64" on rolling builds, or "v1.2.0" /
          # "v1.2.0-nvidia" / "v1.2.0-arm64" on versioned tag runs (the images
          # pushed by the build-versioned-images job).
          ARCH_SUFFIX=""
          if [[ "${{ matrix.architecture }}" == "arm64" ]]; then
            ARCH_SUFFIX="-arm64"
          fi
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            DEFAULT_TAG="${{ github.ref_name }}${{ matrix.variant.suffix }}${ARCH_SUFFIX}"
          else
            DEFAULT_TAG="${{ env.BASE_TAG }}${{ matrix.variant.suffix }}${ARCH_SUFFIX}"
          fi
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: matrix.architecture == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: matrix.architecture != 'arm64'
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso-gnome.toml' || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          additional-args: --use-librepo=True --rootfs btrfs

      - name: Remove manifest JSON files from output
        run: |
          rm -f "${{ steps.build.outputs.output-directory }}"/*.json

      - name: Upload disk images and Checksum to Job Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: disk-images-${{ matrix.variant.name }}-${{ matrix.architecture }}-${{ matrix.disk-type }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

  release:
    name: Publish disk images (SourceForge + GitHub Release)
    needs: build
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.create-release == true)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download disk images
        uses: actions/download-artifact@v7
        with:
          path: release
          pattern: disk-images-*

      - name: Update docs chooser release
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          printf 'window.CALOS_LATEST_RELEASE = %s;\n' "$(printf '%s' "$VERSION" | jq -Rr @json)" > docs/latest-release.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/latest-release.js
          git diff --cached --quiet || git commit -m "Update docs chooser to ${VERSION}"
          git push origin HEAD:main

      - name: Publish disk images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # Artifacts nest the actual disk images under a type dir
          # (e.g. qcow2/disk.qcow2, bootiso/install.iso) — flatten them and
          # name each file calos-<version>_<arch>[<variant>].<ext>:
          #   calos-v1.1.4_x86_64.qcow2        standard x86_64 VM disk
          #   calos-v1.1.4_arm64.iso           standard ARM64 installer
          #   calos-v1.1.4_x86_64-nvidia.iso   NVIDIA installer (x86_64 only)
          # On the rolling channel the version token is "latest"
          # (calos-latest_x86_64.qcow2); on tag runs it is the tag (v1.1.4).
          VERSION_TOKEN="latest"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_TOKEN="${{ github.ref_name }}"
          fi
          found_image=false
          for artifact in release/disk-images-*; do
            [ -d "$artifact" ] || continue
            base=$(basename "$artifact")
            # disk-images-<variant>-<arch>-<disk-type> (variant=field 3, arch=field 4)
            variant=$(printf '%s' "$base" | cut -d- -f3)
            arch=$(printf '%s' "$base" | cut -d- -f4)
            # Map the CI arch token to the user-facing one (amd64 -> x86_64)
            # and the variant to a filename suffix.
            if [[ "$arch" == "arm64" ]]; then
              ARCH_TOKEN="arm64"
            else
              ARCH_TOKEN="x86_64"
            fi
            VARIANT_TOKEN=""
            [[ "$variant" == "nvidia" ]] && VARIANT_TOKEN="-nvidia"
            while IFS= read -r -d '' file; do
              # Skip generated files — only publish actual disk images.
              case "$file" in
                *.json) continue ;;
              esac
              found_image=true
              ext="${file##*.}"
              cp "$file" "dist/calos-${VERSION_TOKEN}_${ARCH_TOKEN}${VARIANT_TOKEN}.${ext}"
            done < <(find "$artifact" -type f -print0)
          done

          if [[ "$found_image" != true ]]; then
            echo "::error::No disk image files found to publish" >&2
            exit 1
          fi

          # SourceForge FRS has no 2 GiB per-asset limit like GitHub Releases
          # (files up to 10 GB replicate to mirrors), so full images are
          # uploaded directly. SourceForge generates MD5/SHA1/SHA256 checksums
          # for every file on the files page, and this README is shown at the
          # project root to explain what each file is.
          cat > dist/README.txt <<'EOF'
          CalOS disk images
          =================

          Files are named calos-<version>_<arch>[<variant>].<ext>:
          - <version> is the release tag (e.g. v1.1.4) on releases, or
            "latest" on the rolling channel (e.g. calos-latest_x86_64.qcow2)
          - <arch> is x86_64 or arm64
          - <variant> is -nvidia for NVIDIA builds (x86_64 only), empty otherwise

          x86_64 (Intel / AMD — what most computers have):
          - calos-<version>_x86_64.iso — USB/installer image (AMD / Intel GPUs)
          - calos-<version>_x86_64.qcow2 — VM disk image for QEMU/Boxes (AMD / Intel GPUs)
          - calos-<version>_x86_64.vmdk — VMware disk image (works with any virtual GPU)
          - calos-<version>_x86_64-nvidia.iso — USB/installer image (NVIDIA GPUs, x86_64 only)
          - calos-<version>_x86_64-nvidia.qcow2 — VM disk image for QEMU/Boxes (NVIDIA GPUs, x86_64 only)

          ARM64 (Apple Silicon, Raspberry Pi-style boards):
          - calos-<version>_arm64.iso — USB/installer image
          - calos-<version>_arm64.qcow2 — VM disk image for QEMU/Boxes
          - calos-<version>_arm64.vmdk — VMware Fusion (Apple Silicon) disk image

          qcow2 and vmdk files are for virtual machines (qcow2 for
          QEMU/Boxes, vmdk for VMware); ISO files are bootable
          USB/installer media. See the project README for install steps.
          EOF

          if [[ -z "$SOURCEFORGE_SSH_KEY" ]]; then
            echo "::error::SOURCEFORGE_SSH_KEY secret is not set" >&2
            exit 1
          fi

          # Upload over rsync to the SourceForge project's FRS directory.
          # (SourceForge recommends rsync for files over 100 MB — it can resume.)
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y rsync
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SOURCEFORGE_SSH_KEY" > ~/.ssh/sourceforge_key
          chmod 600 ~/.ssh/sourceforge_key
          SSH_OPTS="-i $HOME/.ssh/sourceforge_key -o StrictHostKeyChecking=accept-new"
          SF_BASE="callenflynn@frs.sourceforge.net:/home/frs/project/calos-linux"

          # GitHub Releases is the index page; SourceForge hosts the binaries.
          #
          # Tag runs (e.g. v1.2.0) publish a versioned release: the five
          # images go to a per-version SourceForge directory (/1.2.0/), and
          # then a GitHub Release is created/updated with direct download
          # links for THIS version. Versioned files are write-once:
          # --ignore-existing skips files already uploaded (so a rerun fills
          # gaps without touching an older release's files) and
          # --partial-dir keeps interrupted transfers out of the final path
          # so they get retried instead of being treated as complete. No
          # --delete is ever used, so nothing is removed remotely.
          #
          # Non-tag runs (schedule / dispatch) keep publishing to the project
          # root as the rolling "latest" channel.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            REF_NAME="${{ github.ref_name }}"
            VERSION="${REF_NAME#v}"

            # Release codename for the title/notes — same map the versioned
            # container build used to stamp os-release.
            source build_files/codenames.sh
            MINOR="${VERSION%.*}"
            CODENAME="$(calos_codename "${MINOR##*.}")"
            RELEASE_TITLE="CalOS Linux ${VERSION}"
            if [[ -n "${CODENAME}" ]]; then
              RELEASE_TITLE="${RELEASE_TITLE} (${CODENAME})"
            fi

            # A release is only published once all images are present
            # (five x86_64 + three arm64 standard).
            expected=("calos-v${VERSION}_x86_64.iso" "calos-v${VERSION}_x86_64.qcow2" "calos-v${VERSION}_x86_64.vmdk" \
                      "calos-v${VERSION}_x86_64-nvidia.iso" "calos-v${VERSION}_x86_64-nvidia.qcow2" \
                      "calos-v${VERSION}_arm64.iso" "calos-v${VERSION}_arm64.qcow2" "calos-v${VERSION}_arm64.vmdk")
            for file in "${expected[@]}"; do
              if [[ ! -f "dist/$file" ]]; then
                echo "::error::Cannot publish release: missing dist/$file" >&2
                exit 1
              fi
            done

            rsync -a --partial-dir=.rsync-partial --ignore-existing \
              -e "ssh $SSH_OPTS" \
              --exclude README.txt \
              dist/ "$SF_BASE/$VERSION/"

          SF_URL="https://sourceforge.net/projects/calos-linux/files/$VERSION"
          NOTES=$(cat <<EOF
          ## $RELEASE_TITLE

          Disk images are hosted on [SourceForge]($SF_URL).

          **Container images:** \`bootc switch ghcr.io/cstaks/calos:${REF_NAME}\` (x86_64; \`:${REF_NAME}-nvidia\` for NVIDIA hardware, \`:${REF_NAME}-arm64\` for ARM64).

          ### Standard x86_64 (AMD / Intel GPUs) — recommended for most users

          - [calos-v${VERSION}_x86_64.iso]($SF_URL/calos-v${VERSION}_x86_64.iso/download) — bootable USB/installer media
          - [calos-v${VERSION}_x86_64.qcow2]($SF_URL/calos-v${VERSION}_x86_64.qcow2/download) — QEMU/Boxes VM disk image
          - [calos-v${VERSION}_x86_64.vmdk]($SF_URL/calos-v${VERSION}_x86_64.vmdk/download) — VMware VM disk image (works with any virtual GPU)

          ### Standard ARM64 (Apple Silicon, Raspberry Pi-style boards)

          - [calos-v${VERSION}_arm64.iso]($SF_URL/calos-v${VERSION}_arm64.iso/download) — bootable USB/installer media
          - [calos-v${VERSION}_arm64.qcow2]($SF_URL/calos-v${VERSION}_arm64.qcow2/download) — QEMU/Boxes VM disk image
          - [calos-v${VERSION}_arm64.vmdk]($SF_URL/calos-v${VERSION}_arm64.vmdk/download) — VMware Fusion (Apple Silicon) VM disk image

          ### NVIDIA x86_64 (NVIDIA GPUs only)

          Includes the NVIDIA driver stack — do not use on AMD/Intel hardware. NVIDIA builds are x86_64 only.

          - [calos-v${VERSION}_x86_64-nvidia.iso]($SF_URL/calos-v${VERSION}_x86_64-nvidia.iso/download) — bootable USB/installer media
          - [calos-v${VERSION}_x86_64-nvidia.qcow2]($SF_URL/calos-v${VERSION}_x86_64-nvidia.qcow2/download) — QEMU/Boxes VM disk image

          **Standard** is the normal build for AMD/Intel GPUs; **NVIDIA** is only for NVIDIA hardware.
          EOF
          )

            if gh release view "$REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --title "$RELEASE_TITLE" --notes "$NOTES"
            else
              gh release create "$REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --title "$RELEASE_TITLE" --notes "$NOTES"
            fi
          else
            # Drop the stale auto-generated GitHub release from the old flow.
            gh release delete continuous --yes --cleanup-tag 2>/dev/null || true

            rsync -av --partial \
              -e "ssh $SSH_OPTS" \
              dist/ "$SF_BASE/"
          fi

  notify:
    name: Notify Discord
    needs: [build-versioned-images, build, release]
    if: ${{ always() }}
    uses: ./.github/workflows/notify-discord.yml
    with:
      workflow_name: ${{ github.workflow }}
      status: ${{ needs.release.result }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref_name: ${{ github.ref_name }}
      sha: ${{ github.sha }}
      event_name: ${{ github.event_name }}
    secrets: inherit

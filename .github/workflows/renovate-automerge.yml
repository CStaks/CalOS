name: Renovate Auto-merge

on:
  workflow_run:
    # Wait for a real PR-check workflow to finish before deciding whether to
    # auto-merge the Renovate PR (the reusable action re-checks all checks).
    workflows: ["Hadolint"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.workflow_run.conclusion == 'success'
    uses: projectbluefin/actions/.github/workflows/reusable-renovate-automerge.yml@v1
    with:
      head_sha: ${{ github.event.workflow_run.head_sha }}

  notify:
    name: Notify Discord
    needs: automerge
    if: ${{ always() }}
    uses: ./.github/workflows/notify-discord.yml
    with:
      workflow_name: ${{ github.workflow }}
      status: ${{ needs.automerge.result }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ref_name: ${{ github.ref_name }}
      sha: ${{ github.event.workflow_run.head_sha }}
      event_name: ${{ github.event_name }}
      report: "Renovate automerge result: ${{ needs.automerge.result }}"
      report_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit

name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '39 12 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'python', 'actions' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # CalOS has no compiled application; analyze JavaScript and Actions directly.
      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

      - name: Write analysis report
        if: always()
        run: |
          {
            echo "CodeQL language: ${{ matrix.language }}"
            echo "Analysis result: ${{ steps.analyze.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

# CalOS neofetch config
# Uses the same ASCII art as fastfetch for consistency

# Use custom ASCII art
ascii_distro="custom"
ascii_file="/usr/share/fastfetch/calos-logo.txt"

# CalOS brand colors: FF3B00 (primary), 71aab9 (teal), 7a899c (slate)
ascii_colors=(1 6 4 12 8 14)

# Separator between info and ASCII
gap=3

# Info display order
info title
info underline

info "OS" distro
info "Host" model
info "Kernel" kernel
info "Uptime" uptime
info "Packages" packages
info "Shell" shell
info "Resolution" resolution
info "DE" de
info "WM" wm
info "WM Theme" wm_theme
info "Theme" theme
info "Icons" icons
info "Terminal" term
info "Terminal Font" term_font
info "CPU" cpu
info "GPU" gpu
info "Memory" memory

# Color blocks
color_blocks="on"

# Print info
stdout="off"
